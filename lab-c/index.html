<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6f1fc">
    <title>AI Lab C — Grid Canvas</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">AI LAB C</p>
            <h1>Grid canvas</h1>
        </header>

        <section class="canvas" aria-label="Map, unsolved puzzles, and puzzle canvas">
            <div class="intro-section">
                <article id="panel--map" class="panel panel--intro">
                    <h2>Map</h2>

                </article>
                <div class="intro-actions">
                    <button id="locate-btn" class="action-button" type="button">Moja lokalizacja</button>
                    <button id="download-map-btn" class="action-button action-button--secondary" type="button">Pobierz mapę</button>
                    <div class="map-dimensions">
                        <label class="map-dimension">
                            <span>wiersze</span>
                            <input id="rows" name="rows" type="number" min="2" max="100" value="4">
                        </label>
                        <label class="map-dimension">
                            <span>kolumny</span>
                            <input id="columns" name="columns" type="number" min="2" max="100" value="4">
                        </label>
                    </div>
                </div>
            </div>

            <article class="panel panel--grid panel--left panel--unsolved-puzzles">
                <span class="panel-label">Unsolved puzzles</span>
                <div id="unsolved-puzzles" class="tile-grid" role="img" aria-label="Grid for unsolved puzzles">

                </div>
            </article>

            <article class="panel panel--grid panel--double panel--right panel--puzzle-canvas">
                <span class="panel-label">Puzzle canvas</span>
                <div id="puzzle-canvas" class="tile-grid" role="img" aria-label="Canvas for dragging and arranging puzzles">

                </div>
            </article>
        </section>
    </main>
</body>
</html>
