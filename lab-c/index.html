<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6f1fc">
    <title>AI Lab C — Grid Canvas</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">AI LAB C</p>
            <h1>Grid canvas</h1>
        </header>

        <section class="canvas" aria-label="Three vertically stacked rectangles">
            <article class="panel panel--intro">
                <span class="panel-label">01 / Canvas</span>
                <h2>One part</h2>
            </article>

            <article class="panel panel--grid panel--left">
                <span class="panel-label">02 / Canvas</span>
                <div class="tile-grid" role="img" aria-label="A grid of 16 squares">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
            </article>

            <article class="panel panel--grid panel--double panel--right">
                <span class="panel-label">03 / Canvas</span>
                <div class="tile-grid" role="img" aria-label="A grid of 16 squares">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
